<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(alexandria-arabic-900-normal.woff2);font-weight:900;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB,U+061F}
@font-face{font-family:A;src:url(alexandria-arabic-800-normal.woff2);font-weight:800;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB,U+061F}
@font-face{font-family:A;src:url(alexandria-latin-900-normal.woff2);font-weight:900;unicode-range:U+0000-00AA,U+00AC-00BA,U+00BC-00FF}
@font-face{font-family:A;src:url(alexandria-latin-800-normal.woff2);font-weight:800;unicode-range:U+0000-00AA,U+00AC-00BA,U+00BC-00FF}
@font-face{font-family:P;src:url(ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif}
.s{position:absolute;inset:0;display:none}
.on{display:block}
.chip{display:inline-flex;align-items:center;gap:12px;font:800 38px/1 A;padding:16px 30px;border-radius:999px;white-space:nowrap}
.y{background:#FFC400;color:#0B0B0C}.o{border:3px solid #F5F3EE;color:#F5F3EE}.k{background:#0B0B0C;color:#F5F3EE}
.mkw{position:relative;display:inline-block;padding:0 16px;isolation:isolate}
.mkw i{position:absolute;left:0;right:0;bottom:.1em;height:.42em;background:#FFC400;border-radius:6px;z-index:-1}
.zf{position:absolute;width:96px;height:96px;border-radius:24px;background:#FFC400;display:grid;place-items:center;font:900 42px A;color:#0B0B0C;letter-spacing:-2px;direction:ltr}
.hand{position:absolute;left:0;right:0;text-align:center;font:800 34px A;color:#A9A6A0;direction:ltr}
.slot{position:absolute;left:150px;right:150px;border:4px dashed rgba(245,243,238,.35);border-radius:40px;display:grid;place-items:center;font:700 32px P;color:rgba(245,243,238,.45)}
.paper .slot{border-color:rgba(11,11,12,.25);color:rgba(11,11,12,.35)}
/* 1 announce */
#s1{background:#0B0B0C}
#s1 .ph{position:absolute;inset:0;background:url(bg.jpg) 50% 0/cover}
#s1 .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,0) 18%,rgba(11,11,12,0) 45%,rgba(11,11,12,.85) 60%,#0B0B0C 72%)}
#s1 .top{position:absolute;top:150px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center}
#s1 .txt{position:absolute;top:1190px;left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;color:#F5F3EE}
#s1 h1{font:900 112px/1.2 A;white-space:nowrap}#s1 h1 b{color:#FFC400}
#s1 h2{font:800 44px/1.35 A;color:#D9D6CF}
#s1 .steps{display:flex;gap:16px;margin-top:6px}
#s1 .steps span{font:800 40px A;padding:12px 28px;border-radius:22px;border:2px solid rgba(245,243,238,.35);background:rgba(245,243,238,.06);color:#F5F3EE}
#s1 .steps span b{color:#FFC400;margin-left:10px}
/* 2 quiz */
#s2{background:radial-gradient(120% 70% at 50% 38%,#165440 0%,#0F3B2C 55%,#092a1f 100%);color:#F5F3EE}
#s2 .hd{position:absolute;top:170px;left:0;right:0;text-align:center}
#s2 h1{position:absolute;top:330px;left:40px;right:40px;text-align:center;font:900 76px/1.45 A;white-space:nowrap}
#s2 h1 .mkw span{color:#0B0B0C}
#s2 .hint{position:absolute;top:610px;left:0;right:0;text-align:center;font:700 40px P;color:#CFCBC2}
#s2 .bar{position:absolute;top:1530px;left:120px;right:120px;display:flex;gap:16px;justify-content:center}
#s2 .bar span{font:800 36px A;padding:14px 26px;border-radius:20px;background:rgba(245,243,238,.08);border:2px solid rgba(245,243,238,.22)}
/* 3 questions */
#s3{background-color:#F5F3EE;background-image:linear-gradient(90deg,transparent 1000px,rgba(255,196,0,.75) 1000px,rgba(255,196,0,.75) 1005px,transparent 1005px),repeating-linear-gradient(180deg,transparent 0 70px,#E3DED3 70px 72px);color:#0B0B0C}
#s3 .hd{position:absolute;top:180px;left:0;right:0;text-align:center}
#s3 h1{position:absolute;top:330px;left:0;right:0;text-align:center;font:900 128px/1.3 A}
#s3 h2{position:absolute;top:560px;left:60px;right:60px;text-align:center;font:800 62px/1.4 A}
#s3 .ex{position:absolute;top:1480px;left:90px;right:90px;text-align:center;font:700 38px/1.5 P;color:#6B675F}
#s3 .ex b{color:#0B0B0C;font-family:A;font-weight:800}
</style></head><body>
<div id="s1" class="s"><div class="ph"></div><div class="sh"></div>
  <div class="top"><span class="chip y">فيديو جديد</span><div class="zf" style="position:static">ZF</div></div>
  <div class="txt"><span class="chip o" style="font-size:32px;padding:12px 26px">1ère BAC · التعبير والإنشاء</span>
    <h1>كيفاش توسّع <b>فكرة؟</b></h1><h2>الطريقة كاملة فدقيقتين</h2>
    <div class="steps"><span><b>1</b>مقدمة</span><span><b>2</b>عرض</span><span><b>3</b>خاتمة</span></div></div>
</div>
<div id="s2" class="s">
  <div class="hd"><span class="chip y">سؤال سريع</span></div>
  <h1>المقدمة ف<span class="mkw"><i></i><span>توسيع فكرة</span></span><br>فيها شحال من مرحلة؟</h1>
  <div class="hint">جاوب وشوف واش عرفتي</div>
  <div class="hand" style="top:1760px;color:#CFCBC2">@zakaria.faykhi</div>
</div>
<div id="s3" class="s paper">
  <div class="hd"><span class="chip k">دورك</span></div>
  <h1><span class="mkw"><i></i><span>عطيني فكرة</span></span></h1>
  <h2>وأنا نوريك كيفاش<br>توسّعها خطوة بخطوة</h2>
  <div class="ex">مثلاً: <b>«القراءة غذاء الروح»</b> · <b>«الرياضة صحة»</b></div>
  <div class="zf" style="top:1700px;left:492px">ZF</div>
</div>
<script>const n=new URLSearchParams(location.search).get('s')||'1';document.getElementById('s'+n).classList.add('on');
document.fonts.ready.then(()=>{const h=document.querySelector('#s1 h1');let f=112;while(h.scrollWidth>960&&f>60){f-=2;h.style.fontSize=f+'px'}document.body.dataset.ready=1});</script>
</body></html>
