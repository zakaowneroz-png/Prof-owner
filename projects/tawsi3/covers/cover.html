<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Alexandria;src:url(alexandria-arabic-900-normal.woff2);font-weight:900;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB}
@font-face{font-family:Alexandria;src:url(alexandria-arabic-800-normal.woff2);font-weight:800;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB}
@font-face{font-family:Alexandria;src:url(alexandria-latin-900-normal.woff2);font-weight:900;unicode-range:U+0000-00AA,U+00AC-00BA,U+00BC-00FF}
@font-face{font-family:Alexandria;src:url(alexandria-latin-800-normal.woff2);font-weight:800;unicode-range:U+0000-00AA,U+00AC-00BA,U+00BC-00FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0B0B0C;overflow:hidden;font-family:Alexandria,sans-serif;color:#F5F3EE}
.bg{position:absolute;inset:0;background:url(BG) 50% 0/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.35) 0%,rgba(11,11,12,0) 22%,rgba(11,11,12,0) 52%,rgba(11,11,12,.82) 66%,#0B0B0C 80%)}
.chip{font:800 30px Alexandria;padding:12px 28px;border:2.5px solid #F5F3EE;border-radius:999px;background:rgba(11,11,12,.35)}
.zf{position:absolute;top:300px;right:64px;width:76px;height:76px;border-radius:18px;background:#FFC400;display:grid;place-items:center;font:900 34px Alexandria;color:#0B0B0C;letter-spacing:-2px;direction:ltr}
.zf::after{content:"";position:absolute;bottom:16px;width:38px;height:4px;border-radius:2px;background:#0B0B0C}
.zf span{margin-top:-10px}
.txt{position:absolute;left:0;right:0;top:1250px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font:900 120px/1.2 Alexandria;white-space:nowrap;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h1 b{color:#FFC400;font-weight:900}
h2{font:800 46px/1.3 Alexandria;color:#D9D6CF}
.tags{display:flex;gap:22px;align-items:center;margin-top:10px}
.tag{font:800 44px Alexandria;padding:10px 30px;border:2px solid rgba(245,243,238,.35);border-radius:22px;background:rgba(245,243,238,.06)}
.more{font:800 34px Alexandria;color:#A9A6A0;direction:ltr}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="zf"><span>ZF</span></div>
<div class="txt">
  <div class="chip">1ère BAC · اللغة العربية</div>
  <h1>كيفاش توسّع <b>فكرة؟</b></h1>
  <h2>التعبير والإنشاء · الامتحان الجهوي</h2>
  <div class="tags"><span class="tag">مقدمة</span><span class="tag">عرض</span><span class="tag">خاتمة</span></div>
</div>
<script>
const q=new URLSearchParams(location.search);document.querySelector('.bg').style.backgroundImage='url('+(q.get('bg')||'cand-13.jpg')+')';
document.fonts.ready.then(()=>{const h=document.querySelector('h1');let f=120;while(h.scrollWidth>960&&f>60){f-=2;h.style.fontSize=f+'px'}document.body.dataset.ready=1});
</script></body></html>
