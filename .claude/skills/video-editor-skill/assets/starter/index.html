<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>starter edit</title>
    <!-- Video Editor Skill starter. Libraries load locally (scripts/vendor.sh assets/vendor). -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <script src="assets/captions.js"></script>
    <script src="assets/edit.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      /* Brand fonts: put files in assets/fonts and declare them here, e.g.
         @font-face { font-family: "Brand Sans"; src: url("assets/fonts/BrandSans-Bold.woff2") format("woff2"); font-weight: 700; } */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      .layer { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; overflow: hidden; }
      #bgPaper { background: var(--paper); }
      .vid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; object-fit: cover; }
      #sceneUI { display: grid; place-items: center; align-content: center; gap: 28px; text-align: center; padding: 0 var(--edge); }
      #title { font: 800 150px/1.1 var(--font-title); color: var(--ink); letter-spacing: -0.02em; }
      #sub { font: 500 46px/1.3 var(--font-caption); color: var(--accent); }
      /* captions: one span per word; tight edge only (soft shadows show as blobs on light clothing) */
      .cap { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-family: var(--font-caption);
        color: var(--text); text-shadow: var(--cap-edge); }
      .cap.scene { color: var(--ink); text-shadow: none; }
      .cap .l1, .cap .l2 { position: relative; line-height: 1.25; }
      .cap .w { display: inline-block; margin: 0 10px; font-weight: var(--cap-weight); font-size: var(--cap-size); }
      .cap .w.s { font-size: var(--cap-accent-size); color: var(--accent); }
      [dir="rtl"] .cap { direction: rtl; }
    </style>
  </head>
  <body>
    <!-- data-duration = footage length (seconds); keep it equal to EDIT.DUR -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="bgPaper" class="layer"></div>
        <div id="sceneUI" class="layer"><div id="title"></div><div id="sub"></div></div>
        <div id="footWrap" class="layer">
          <video id="foot" class="vid" src="assets/source.mp4" data-start="0" data-duration="10" data-has-audio="true" playsinline></video>
        </div>
        <svg id="irisEdge" class="layer" width="1080" height="1920" fill="none"><polygon id="irisPoly" stroke="var(--accent)" stroke-width="10" stroke-linejoin="round" /></svg>
      </div>
      <div id="caps" class="layer"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const wordHTML = (w) => { const s = w.startsWith("*"); w = w.replace(/^\*/, ""); const latin = /^[A-Za-z0-9 .,'!?%$-]+$/.test(w);
        return `<span class="w${s ? " s" : ""}"${latin && document.documentElement.dir === "rtl" ? ' dir="ltr"' : ""}>${w}</span>`; };

      // right-to-left captions (Arabic, Hebrew, Persian, Urdu): flip the page direction so words read in order
      if (/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/.test(JSON.stringify(window.CAPTIONS || []))) document.documentElement.dir = "rtl";

      document.fonts.ready.then(() => {
        const E = window.EDIT;
        $("title").textContent = E.SCENE.title; $("sub").textContent = E.SCENE.sub;
        // build caption DOM once; render() only writes styles
        const caps = E.CAPS.map((c) => {
          const el = document.createElement("div"); el.className = "cap";
          el.innerHTML = `<div class="l1">${c.l1.map(wordHTML).join("")}</div><div class="l2">${c.l2.map(wordHTML).join("")}</div>`;
          $("caps").appendChild(el);
          return { el, l1: [...el.querySelectorAll(".l1 .w")], l2: [...el.querySelectorAll(".l2 .w")] };
        });

        function render(f) {
          const S = E.sceneAt(f), F = S.foot, C = S.cam, SC = S.scene;
          Object.assign($("cam").style, { transformOrigin: `${C.f.x}px ${C.f.y}px`, scale: `${C.s}`, filter: C.blur > 0.2 ? `blur(${C.blur}px)` : "none" });
          $("bgPaper").style.display = SC.on ? "" : "none";
          $("sceneUI").style.display = SC.on ? "" : "none";
          if (SC.on) {
            Object.assign($("title").style, { translate: `0px ${SC.title.y}px`, opacity: SC.title.o, filter: SC.title.blur > 0.2 ? `blur(${SC.title.blur}px)` : "none" });
            Object.assign($("sub").style, { translate: `0px ${SC.sub.y}px`, opacity: SC.sub.o });
          }
          $("footWrap").style.display = F.show ? "" : "none";
          if (F.show) {
            $("footWrap").style.clipPath = F.clip;
            Object.assign($("foot").style, { translate: `${F.img.x}px ${F.img.y}px`, scale: `${F.img.s}` });
          }
          const I = F.iris; $("irisEdge").style.display = I && I.r > 0.5 ? "" : "none";
          if (I && I.r > 0.5) {
            const q = I.r + 5; $("irisPoly").setAttribute("points", `${I.c.x},${I.c.y - q} ${I.c.x + q},${I.c.y} ${I.c.x},${I.c.y + q} ${I.c.x - q},${I.c.y}`);
            $("irisEdge").style.opacity = 1 - clamp((I.r - 500) / 700);
          }
          S.caps.forEach((c, i) => {
            const D = caps[i]; D.el.style.display = c.visible ? "" : "none";
            if (!c.visible) return;
            D.el.classList.toggle("scene", S.capZone === "scene"); D.el.style.top = `${E.ZONE_TOP[S.capZone]}px`;
            Object.assign(D.el.style, { translate: `0px ${c.exit.y}px`, opacity: c.exit.o, filter: c.exit.blur > 0.2 ? `blur(${c.exit.blur}px)` : "none" });
            const paint = (els, st) => els.forEach((w, k) => { const s = st[k]; Object.assign(w.style, { translate: `0px ${s.y}px`, opacity: s.o, filter: s.blur > 0.2 ? `blur(${s.blur}px)` : "none" }); });
            paint(D.l1, c.l1); paint(D.l2, c.l2);
          });
        }

        // the one paused root timeline HyperFrames seeks: a proxy tween that renders frame by frame
        const tl = gsap.timeline({ paused: true });
        const proxy = { f: 0 }, FR = Math.round(E.DUR * E.FPS);
        tl.to(proxy, { f: FR, duration: E.DUR, ease: "none", onUpdate: () => render(Math.min(FR - 1, Math.round(proxy.f))) }, 0);
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
